# Markkit – Extract markdown from any format
# Workspace root

[workspace]
resolver = "2"
members = [
    "crates/markkit",
    "crates/markkit-cli",
    "crates/markkit-bench",
    "crates/markkit-eval",
    "crates/markkit-python",
    "crates/markkit-js",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
authors = ["Everruns <oss@everruns.com>"]
repository = "https://github.com/everruns/markkit"
keywords = ["markdown", "extraction", "conversion", "html", "pdf"]
categories = ["text-processing", "command-line-utilities", "parser-implementations"]

[workspace.dependencies]
# Async
tokio = { version = "1", default-features = false }

# Error handling
thiserror = "2"
anyhow = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# HTTP
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }

# HTML parsing
scraper = "0.29"
html5ever = "0.40"

# Document formats
calamine = "0.37"       # Excel/spreadsheet (XLSX/XLS/ODS)
zip = { version = "9", default-features = false, features = ["deflate"] }  # OOXML/ODF containers; matches calamine's zip
quick-xml = "0.42"      # DOCX/ODS XML parsing
cfb = "0.15"            # XLS (OLE2) container pre-scan
pulldown-cmark = { version = "0.13", default-features = false }  # Markdown input

# Logging
tracing = "0.1"

# Python bindings
pyo3 = { version = "0.30" }
pyo3-async-runtimes = { version = "0.30", features = ["tokio-runtime"] }

# Node.js bindings
napi = { version = "3", features = ["async", "serde-json"] }
napi-derive = "3"

# Testing
tempfile = "3"
criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
