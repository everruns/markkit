name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings
      # OKF v0.2 conformance of knowledge/. okf-lint enforces the spec;
      # check_okf.py enforces bundle-local conventions it does not cover.
      # Keep the version and --max-line-length in lockstep with the justfile.
      - name: Install okf-lint
        run: cargo install okf-lint --version 0.1.1 --locked
      - name: Check knowledge bundle (OKF)
        run: |
          python3 scripts/check_okf.py knowledge
          okf-lint knowledge --max-line-length 10000
      - name: Test repo scripts
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Install cargo-deny
        run: cargo install cargo-deny
      - name: Security audit
        run: cargo audit
      - name: License and dependency check
        run: cargo deny check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace
      - name: Run tests (all features)
        run: cargo test --workspace --all-features
      - name: Run tests (office formats, no HTTP client)
        run: |
          if cargo tree -p markkit -e normal | grep -E 'reqwest|hyper'; then
            echo "HTTP client leaked into the default feature set"
            exit 1
          fi
          cargo test -p markkit --no-default-features --features docx,spreadsheet
          if cargo tree -p markkit --no-default-features --features docx,spreadsheet -e normal | grep -E 'reqwest|hyper'; then
            echo "HTTP client leaked into the docx,spreadsheet feature set"
            exit 1
          fi
      - name: Run examples
        run: |
          for ex in basic custom_selectors configuration ir_access; do
            cargo run -q -p markkit --example "$ex"
          done

  check:
    name: Check
    needs: [lint, audit, test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: All jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.audit.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
