name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin
      - name: Generate coverage
        # llvm engine: the default ptrace engine segfaults on multi-threaded
        # tokio socket tests (tests/url_security.rs)
        run: cargo tarpaulin --workspace --engine llvm --out xml
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          file: cobertura.xml
          fail_ci_if_error: false
