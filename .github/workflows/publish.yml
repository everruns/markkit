name: Publish

# Decisions:
# - Runs from a release tag (dispatched by release.yml, or manually from a tag).
# - Idempotent: a crate whose version is already on crates.io is skipped, so
#   re-running a release never fails on an already-published crate.
# - Each crate is verified with a dry run before the credentialed upload.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify tag and version
        id: version
        run: |
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: publish must run from a release tag (vX.Y.Z), got $GITHUB_REF"
            exit 1
          fi
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Error: tag version ($TAG_VERSION) does not match Cargo.toml ($CARGO_VERSION)"
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Error: publish source is not reachable from origin/main"
            exit 1
          fi
          echo "version=$CARGO_VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish crates
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          published() {
            curl -sf -A "markkit-release (github.com/everruns/markkit)" \
              "https://crates.io/api/v1/crates/$1/$VERSION" > /dev/null
          }
          # Dependency order: markkit-cli depends on markkit.
          for crate in markkit markkit-cli; do
            if published "$crate"; then
              echo "$crate $VERSION already on crates.io; skipping"
              continue
            fi
            cargo publish --dry-run -p "$crate"
            cargo publish --no-verify -p "$crate"
          done
