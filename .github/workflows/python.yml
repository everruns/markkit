name: Python

on:
  push:
    branches: [main]
    paths:
      - "crates/markkit-python/**"
      - "crates/markkit/**"
  pull_request:
    branches: [main]
    paths:
      - "crates/markkit-python/**"
      - "crates/markkit/**"

permissions:
  contents: read

jobs:
  build:
    name: Build Python bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install maturin
        run: pip install maturin
      - name: Build
        run: maturin build
      - name: Test import
        run: |
          pip install target/wheels/*.whl
          python -c 'from importlib.metadata import metadata; import markkit; assert metadata("markkit")["Name"] == "markkit"; assert markkit.extract_html_sync("<h1>Smoke</h1>").strip() == "# Smoke"; print("Distribution and import OK")'
      - name: Test structured documents and PDF layout
        run: python -m unittest discover -s crates/markkit-python/tests -p 'test_*.py'
