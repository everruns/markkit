name: Fuzz

# Nightly cargo-fuzz run of every target in crates/markkit/fuzz (too slow
# for PRs). Each target checks the S17 output oracle, not just "no panic".
# Crashes upload as artifacts; reproduce with
#   cargo +nightly fuzz run <target> <artifact>   (from crates/markkit)
# See knowledge/security/fuzzing.md.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      duration:
        description: "Seconds per target (positive integer)"
        required: false
        default: "300"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: [html, document, docx_xml, xlsx_xml, xlsb_bin, ods_xml, xls_biff, pdf, markdown, csv, render_ir]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/markkit/fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Cache corpus
        uses: actions/cache@v6
        with:
          path: crates/markkit/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Run ${{ matrix.target }}
        working-directory: crates/markkit
        env:
          TARGET: ${{ matrix.target }}
          DURATION_INPUT: ${{ github.event.inputs.duration || '300' }}
        run: |
          # workflow_dispatch input: validate before it reaches the shell.
          if ! [[ "$DURATION_INPUT" =~ ^[1-9][0-9]{0,4}$ ]]; then
            echo "::error::duration must be a positive integer (max 5 digits), got: $DURATION_INPUT"
            exit 1
          fi
          # New inputs go to the first (cached) dir; the rest are read-only seeds.
          mkdir -p "fuzz/corpus/$TARGET"
          seeds=()
          [ -d "fuzz/seeds/$TARGET" ] && seeds+=("fuzz/seeds/$TARGET")
          [ "$TARGET" = html ] && seeds+=(tests/fixtures/html)
          cargo +nightly fuzz run -O "$TARGET" "fuzz/corpus/$TARGET" "${seeds[@]}" -- \
            -max_total_time="$DURATION_INPUT" -max_len=65536 -print_final_stats=1
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: crates/markkit/fuzz/artifacts/${{ matrix.target }}
          retention-days: 30
