name: Publish Python

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify without publishing"
        required: false
        default: "true"
      source_ref:
        description: "Release tag to build; defaults to the selected workflow ref"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build and verify Python distributions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify publish source
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          SOURCE_REF: ${{ inputs.source_ref || github.ref_name }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          SOURCE_SHA=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main

          if [ "$DRY_RUN" = "false" ]; then
            if [[ ! "$SOURCE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::publishing requires an exact vX.Y.Z source tag"
              exit 1
            fi
            git fetch --force origin "refs/tags/$SOURCE_REF:refs/tags/$SOURCE_REF"
            TAG_SHA=$(git rev-list -n 1 "$SOURCE_REF")
            if [ "$SOURCE_SHA" != "$TAG_SHA" ]; then
              echo "::error::checked-out source $SOURCE_SHA does not match $SOURCE_REF at $TAG_SHA"
              exit 1
            fi
            PACKAGE_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
            if [ "${SOURCE_REF#v}" != "$PACKAGE_VERSION" ]; then
              echo "::error::tag $SOURCE_REF does not match package version $PACKAGE_VERSION"
              exit 1
            fi
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install verification tools
        run: python -m pip install twine==7.0.0
      - name: Build portable distributions
        uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8 # v1
        with:
          target: x86_64
          manylinux: "2014"
          maturin-version: "1.15.0"
          before-script-linux: git config --global --add safe.directory "$GITHUB_WORKSPACE"
          args: --release --locked --sdist --out target/wheels -i python3.12
      - name: Verify build preserved the patched lockfile
        run: git diff --exit-code -- Cargo.lock
      - name: Inspect distribution identity
        id: metadata
        run: |
          python <<'PYTHON'
          import email.parser
          import os
          import pathlib
          import zipfile
          wheels = list(pathlib.Path("target/wheels").glob("*.whl"))
          assert len(wheels) == 1
          with zipfile.ZipFile(wheels[0]) as wheel:
              metadata = email.parser.BytesParser().parsebytes(wheel.read(next(name for name in wheel.namelist() if name.endswith(".dist-info/METADATA"))))
          assert metadata["Name"] == "markkit"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"version={metadata['Version']}", file=output)
          print(f"markkit {metadata['Version']} from {os.popen('git rev-parse HEAD').read().strip()}")
          PYTHON
      - name: Verify distributions and native import
        run: |
          python -m twine check --strict target/wheels/*.whl target/wheels/*.tar.gz
          python -m venv "$RUNNER_TEMP/markkit-wheel-smoke"
          "$RUNNER_TEMP/markkit-wheel-smoke/bin/python" -m pip install --no-deps target/wheels/*.whl
          "$RUNNER_TEMP/markkit-wheel-smoke/bin/python" -c 'import importlib.metadata, importlib.util, markkit; assert importlib.metadata.metadata("markkit")["Name"] == "markkit"; assert importlib.util.find_spec("markkit_python") is None; assert markkit.extract_html_sync("<h1>Smoke</h1>").strip() == "# Smoke"'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: |
            target/wheels/*.whl
            target/wheels/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish Python package with OIDC
    needs: build
    if: inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/

  verify:
    name: Verify public PyPI installation
    needs: [build, publish]
    runs-on: ubuntu-latest
    env:
      MARKKIT_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist
      - name: Download the published wheel
        run: |
          for attempt in 1 2 3 4 5; do
            if python -m pip download --no-cache-dir --only-binary=:all: --no-deps --dest registry "markkit==$MARKKIT_VERSION"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep 10
          done
      - name: Verify public files match the build
        run: |
          python <<'PYTHON'
          import hashlib
          import json
          import os
          import pathlib
          import urllib.request
          version = os.environ["MARKKIT_VERSION"]
          with urllib.request.urlopen(f"https://pypi.org/pypi/markkit/{version}/json") as response:
              published = json.load(response)
          assert published["info"]["name"] == "markkit"
          assert published["info"]["version"] == version
          digests = {entry["filename"]: entry["digests"]["sha256"] for entry in published["urls"]}
          for artifact in pathlib.Path("dist").iterdir():
              assert digests[artifact.name] == hashlib.sha256(artifact.read_bytes()).hexdigest()
          for wheel in pathlib.Path("registry").glob("*.whl"):
              assert digests[wheel.name] == hashlib.sha256(wheel.read_bytes()).hexdigest()
          print(f"Public markkit {version} distributions match the build")
          PYTHON
      - name: Install and smoke-test the public wheel
        run: |
          python -m venv "$RUNNER_TEMP/markkit-public-smoke"
          "$RUNNER_TEMP/markkit-public-smoke/bin/python" -m pip install --no-index --no-deps registry/*.whl
          "$RUNNER_TEMP/markkit-public-smoke/bin/python" -c 'import importlib.metadata, importlib.util, markkit; assert importlib.metadata.version("markkit") == __import__("os").environ["MARKKIT_VERSION"]; assert importlib.util.find_spec("markkit_python") is None; assert markkit.extract_html_sync("<h1>Published smoke</h1>").strip() == "# Published smoke"; print("Public markkit import and native extraction PASS")'
