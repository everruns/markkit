# Publish @everruns/markkit through npm trusted publishing (GitHub OIDC).
# npm publisher: everruns/markkit, publish-js.yml, no environment.
# Only an explicit dry_run=false uploads; npm >= 11.5.1 is required.

name: Publish JavaScript

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run"
        required: false
        default: "true"

permissions:
  contents: read

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify publish source is reachable from main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
          registry-url: "https://registry.npmjs.org"
      - name: Require npm with trusted publishing (>= 11.5.1)
        run: |
          npm_ok() {
            node -e 'const [a,b,c]=process.argv[1].split(".").map(Number);process.exit(a>11||(a==11&&(b>5||(b==5&&c>=1)))?0:1)' "$(npm --version)"
          }
          npm_ok || npm install -g npm@11.6.2
          npm_ok || { echo "::error::npm $(npm --version) lacks trusted publishing"; exit 1; }
      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./crates/markkit-js/package.json').version")
          if [[ "$GITHUB_REF" =~ ^refs/tags/v ]] && [ "${GITHUB_REF#refs/tags/v}" != "$PKG_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF#refs/tags/} does not match package version $PKG_VERSION"
            exit 1
          fi
      - name: Install dependencies
        run: cd crates/markkit-js && npm install --ignore-scripts --audit=false --fund=false
      - name: Build
        run: cd crates/markkit-js && npx --no-install napi build --release --platform
      - name: Verify build preserved the patched lockfile
        run: git diff --exit-code -- Cargo.lock
      - name: Verify installed npm package
        run: |
          cd crates/markkit-js
          npm pack --ignore-scripts --json > "$RUNNER_TEMP/markkit-pack.json"
          node -e 'const p=require(process.argv[1])[0]; const files=p.files.map(f=>f.path); if(!files.includes("index.js") || !files.some(f=>f.endsWith(".node"))) throw Error("npm package must contain its loader and native binary")' "$RUNNER_TEMP/markkit-pack.json"
          TARBALL=$(node -e 'console.log(require(process.argv[1])[0].filename)' "$RUNNER_TEMP/markkit-pack.json")
          npm install --prefix "$RUNNER_TEMP/markkit-npm-smoke" --ignore-scripts --audit=false --fund=false "$PWD/$TARBALL"
          node -e 'const m=require(process.argv[1]); if(m.extractHtmlSync("<h1>Smoke</h1>").trim()!=="# Smoke") throw Error("native extraction smoke failed")' "$RUNNER_TEMP/markkit-npm-smoke/node_modules/@everruns/markkit"
      - name: Publish
        working-directory: crates/markkit-js
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" != "false" ]; then
            npm publish --dry-run --ignore-scripts --access public
          else
            npm publish --ignore-scripts --access public
          fi
