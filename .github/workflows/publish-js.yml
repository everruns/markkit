name: Verify published JavaScript

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Verification only; never publishes"
        required: false
        default: "true"

permissions:
  contents: read

jobs:
  verify:
    name: Verify public npm installation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
      - name: Inspect exact published version
        run: npm view @everruns/markkit@0.1.1 --json
      - name: Install from public npm without lifecycle scripts
        run: npm install --prefix "$RUNNER_TEMP/markkit-registry-smoke" --ignore-scripts --audit=false --fund=false @everruns/markkit@0.1.1
      - name: Verify actual installed native module
        env:
          PACKAGE_PATH: ${{ runner.temp }}/markkit-registry-smoke/node_modules/@everruns/markkit
        run: |
          node <<'JS'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const path = require("node:path");
          const crypto = require("node:crypto");
          const root = process.env.PACKAGE_PATH;
          const manifest = require(path.join(root, "package.json"));
          assert.equal(manifest.name, "@everruns/markkit");
          assert.equal(manifest.version, "0.1.1");
          const native = fs.readdirSync(root).filter(name => name.endsWith(".node"));
          assert.ok(native.length > 0, "Published package must include native binary");
          const markkit = require(root);
          assert.equal(markkit.extractHtmlSync("<h1>Published smoke</h1>").trim(), "# Published smoke");
          console.log(JSON.stringify({package: manifest.name, version: manifest.version, platform: process.platform, arch: process.arch, node: process.version, native: native.map(name => ({name, sha256: crypto.createHash("sha256").update(fs.readFileSync(path.join(root, name))).digest("hex")})), extraction: "PASS"}));
          JS
