[build-system]
requires = ["maturin>=1,<2"]
build-backend = "maturin"

[project]
name = "markkit"
dynamic = ["version", "description", "authors", "license"]
readme = "crates/markkit-python/README.md"
requires-python = ">=3.9"
keywords = ["markdown", "html", "pdf", "docx", "xlsx", "extraction", "llm", "rag", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/everruns/markkit"
Documentation = "https://github.com/everruns/markkit/blob/main/crates/markkit-python/README.md"
Repository = "https://github.com/everruns/markkit"
Changelog = "https://github.com/everruns/markkit/blob/main/CHANGELOG.md"
Issues = "https://github.com/everruns/markkit/issues"

[tool.maturin]
manifest-path = "crates/markkit-python/Cargo.toml"
module-name = "markkit"
# Preserve all workspace members so the security lockfile stays valid in sdists.
sdist-generator = "git"
locked = true
exclude = [{ path = ".claude/skills", format = "sdist" }]
