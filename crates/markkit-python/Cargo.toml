# Markkit Python bindings via PyO3
# Expose markkit as a Python module

[package]
name = "markkit-python"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Python bindings for Markkit markdown extraction via PyO3"

[lib]
name = "markkit_python"
crate-type = ["cdylib"]
doc = false

[features]
pdf-ocr-ocrs = ["markkit/pdf-ocr-ocrs"]

[dependencies]
markkit = { path = "../markkit", features = ["all_formats", "pdf-ocr", "http_client"] }
serde_json.workspace = true
pyo3.workspace = true
pyo3-async-runtimes.workspace = true
