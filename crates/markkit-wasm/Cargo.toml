# Markkit browser bindings via wasm-bindgen.
#
# Decision: slim, single-threaded wasm32-unknown-unknown build, separate from the
# napi `markkit-js` crate (same split as bashkit-wasm). No threads, no WASI, no
# SharedArrayBuffer and no COOP/COEP headers, so it runs in browsers, edge
# workers (Cloudflare, Vercel, Deno Deploy), Node, Deno and Bun.
#
# Feature surface: html, docx, spreadsheet, tool. `http_client` is excluded:
# reqwest needs sockets; JS hosts fetch themselves and pass bytes in, which also
# keeps SSRF policy with the host. See knowledge/runtimes/wasm-package.md.

[package]
name = "markkit-wasm"
description = "Browser (WebAssembly) bindings for Markkit markdown extraction"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doc = false

[dependencies]
markkit = { path = "../markkit", default-features = false, features = [
    "html",
    "docx",
    "spreadsheet",
    "tool",
] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = "0.6"
