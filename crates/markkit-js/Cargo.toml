# Markkit Node.js bindings via NAPI-RS
# Expose markkit as a native Node.js module

[package]
name = "markkit-js"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Node.js bindings for Markkit markdown extraction via NAPI-RS"

[lib]
crate-type = ["cdylib"]
doc = false

[dependencies]
markkit = { path = "../markkit", features = ["all_formats", "http_client"] }
napi.workspace = true
napi-derive.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[build-dependencies]
napi-build = "2"
