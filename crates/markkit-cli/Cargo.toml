# Markkit CLI – Command line interface for markkit
# Extract markdown from files and URLs

[package]
name = "markkit-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Command line interface for Markkit markdown extraction"
readme = "../../README.md"

[lib]
name = "markkit_cli"
path = "src/lib.rs"

[[bin]]
name = "markkit"
path = "src/main.rs"
doc = false

[features]
default = ["all_formats", "pdf-ocr", "native-http"]
# URL sources in `NativeHost` via markkit's own reqwest client. Embedders that
# fetch through their own egress (bashkit) leave this off: no reqwest, no TLS.
native-http = ["markkit/http_client"]
all_formats = ["markkit/all_formats"]
pdf = ["markkit/pdf"]
pdf-ocr = ["pdf", "markkit/pdf-ocr"]
pdf-ocr-ocrs = ["pdf-ocr", "markkit/pdf-ocr-ocrs"]
docx = ["markkit/docx"]
pptx = ["markkit/pptx"]
spreadsheet = ["markkit/spreadsheet"]
markdown = ["markkit/markdown"]
email = ["markkit/email"]
odt = ["markkit/odt"]
epub = ["markkit/epub"]

[dependencies]
markkit = { path = "../markkit", version = "0.3.1", features = ["tool"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "io-std", "io-util"] }
clap.workspace = true
anyhow.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"
