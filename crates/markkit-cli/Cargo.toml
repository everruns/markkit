# Markkit CLI – Command line interface for markkit
# Extract markdown from files and URLs

[package]
name = "markkit-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Command line interface for Markkit markdown extraction"
readme = "../../README.md"

[[bin]]
name = "markkit"
path = "src/main.rs"
doc = false

[features]
default = ["all_formats", "pdf-ocr"]
all_formats = ["markkit/all_formats"]
pdf = ["markkit/pdf"]
pdf-ocr = ["pdf", "markkit/pdf-ocr"]
pdf-ocr-ocrs = ["pdf-ocr", "markkit/pdf-ocr-ocrs"]
docx = ["markkit/docx"]
pptx = ["markkit/pptx"]
spreadsheet = ["markkit/spreadsheet"]
markdown = ["markkit/markdown"]
email = ["markkit/email"]
odt = ["markkit/odt"]
epub = ["markkit/epub"]

[dependencies]
markkit = { path = "../markkit", version = "0.2.0", features = ["http_client", "tool"] }
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "time", "fs", "io-std", "io-util"] }
clap.workspace = true
anyhow.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"
