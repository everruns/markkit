# Markkit CLI – Command line interface for markkit
# Extract markdown from files and URLs

[package]
name = "markkit-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Command line interface for Markkit markdown extraction"
readme = "../../README.md"

[[bin]]
name = "markkit"
path = "src/main.rs"
doc = false

[features]
default = ["all_formats"]
all_formats = ["markkit/all_formats"]
pdf = ["markkit/pdf"]
docx = ["markkit/docx"]
spreadsheet = ["markkit/spreadsheet"]

[dependencies]
markkit = { path = "../markkit", version = "0.1.0", features = ["http_client"] }
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "time"] }
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"
